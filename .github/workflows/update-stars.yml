name: Update GitHub Stars

on:
  push:
    paths:
      - 'content/stars.md'
  schedule:
    - cron: '30 5 * * *'  # 每天 05:30 UTC 运行（StarList 之后）
  workflow_dispatch:      # 允许手动触发
jobs:
  update-stars:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Generate stars.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/workflows/update_stars.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/stars.md
          git commit -m "feat: sync github stars from StarList" || echo "No changes to commit"
          for i in {1..3}; do
            git push && break || sleep 60
          done
